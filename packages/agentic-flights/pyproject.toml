[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agentic-flights"
version = "0.1.0"
description = "Flight search for AI agents, powered by Agentic Flights"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Alberto Tamez Gonzalez"}]
dependencies = ["agentic-google-flights-tool==0.1.0"]

[project.urls]
Repository = "https://github.com/alberto-tamez/agentic-google-flights-tool"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_flights_alias"]
