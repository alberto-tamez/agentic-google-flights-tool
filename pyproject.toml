[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agentic-flights"
version = "0.7.0"
description = "Explore and compare flight options with AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Alberto Tamez Gonzalez"}]
keywords = ["flights", "travel", "google-flights", "browser-automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = [
    "curl-cffi>=0.7.4,<1",
    "primp>=1.3,<3",
    "playwright>=1.62,<2",
    "pydantic>=2.10,<3",
]

[project.optional-dependencies]
mcp = ["mcp>=2,<3", "uvicorn>=0.31.1,<1"]
dev = [
    "hypothesis>=6.112,<7",
    "pytest>=9.0.3,<10",
    "ruff>=0.8",
]

[project.urls]
Homepage = "https://github.com/alberto-tamez/agentic-google-flights-tool"
Repository = "https://github.com/alberto-tamez/agentic-google-flights-tool"
Issues = "https://github.com/alberto-tamez/agentic-google-flights-tool/issues"

[project.scripts]
agentic-flights-mcp = "agentic_flights.mcp_server:main"
agentic-flights = "agentic_flights.cli:main"

[tool.hatch.build]
exclude = ["/experiments", "/artifacts"]

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_flights"]

[tool.pytest.ini_options]
addopts = "-q -m 'not integration and not live'"
testpaths = ["tests"]
markers = [
    "feature(name): maps a test to a user-facing capability",
    "live: calls the live reverse-engineered Google Flights endpoint",
    "integration: optional local server tests; run explicitly with -m integration",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.hatch.build.targets.wheel.force-include]
"docs/agent-guide.md" = "agentic_flights/_docs/agent-guide.md"
"docs/reference.md" = "agentic_flights/_docs/reference.md"
"docs/strategy-playbook.md" = "agentic_flights/_docs/strategy-playbook.md"
"THIRD_PARTY_NOTICES.md" = "agentic_flights/_docs/THIRD_PARTY_NOTICES.md"
"skill/agentic-flights/SKILL.md" = "agentic_flights/_skill/agentic-flights/SKILL.md"
