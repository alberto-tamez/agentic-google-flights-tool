[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "reverse-google-flights"
version = "0.1.0"
description = "Run bounded, cached Google Flights searches through browser automation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Alberto Tamez Gonzalez"}]
keywords = ["flights", "travel", "google-flights", "browser-automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = [
    "fast-flights==3.1.0",
    "playwright>=1.62,<2",
    "pydantic>=2.10,<3",
]

[project.optional-dependencies]
fli = ["flights==0.9.0"]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.8",
]

[project.urls]
Homepage = "https://github.com/alberto-tamez/reverse-google-flights"
Repository = "https://github.com/alberto-tamez/reverse-google-flights"
Issues = "https://github.com/alberto-tamez/reverse-google-flights/issues"

[project.scripts]
reverse-google-flights = "reverse_google_flights.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reverse_google_flights"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = ["live: calls the live reverse-engineered Google Flights endpoint"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
