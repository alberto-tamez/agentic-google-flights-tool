name: Publish Agentic Flights Alias to PyPI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check alias version and dependency pins
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path
          main = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          alias = tomllib.loads(Path("packages/agentic-flights/pyproject.toml").read_text())["project"]
          name, version = main["name"], main["version"]
          assert alias["version"] == version, "Alias version differs from main package"
          assert alias["dependencies"] == [f"{name}=={version}"], "Alias dependency differs"
          assert alias["optional-dependencies"]["mcp"] == [f"{name}[mcp]=={version}"], "MCP pin differs"
          PY
      - run: python -m pip install build twine
      - run: python -m build packages/agentic-flights --outdir dist
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: agentic-flights-distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/agentic-flights/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: agentic-flights-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
